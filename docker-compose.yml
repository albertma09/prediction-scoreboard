services:
  db:
    image: postgres:16-alpine
    container_name: scoreboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: prediction_scoreboard
      POSTGRES_USER: scoreboard
      POSTGRES_PASSWORD: scoreboard_dev
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - scoreboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoreboard -d prediction_scoreboard"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  scoreboard_pgdata:
