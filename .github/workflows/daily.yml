name: Ciclo diario

on:
  schedule:
    - cron: '5 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: database-write
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: UTC
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migraciones pendientes
        run: npm run migrate

      - name: Precios del universo puntuable
        run: npm run ingest

      - name: Emitir predicciones del slot de hoy
        if: github.event_name == 'schedule'
        run: npm run predict

      - name: Resolver las que han vencido
        run: npm run resolve

      - name: Precios del catalogo completo
        run: npm run ingest -- --catalog --years=1 --quiet

      - name: Consultas precalculadas
        run: npm run consult

      - name: Verificar la cadena de hashes
        run: npm run verify-ledger

      - name: Exportar snapshot
        run: npm run snapshot

      - name: Dependencias del panel
        run: npm --prefix panel ci

      - name: Compilar panel
        run: npm --prefix panel run build -- --base-href="/${{ github.event.repository.name }}/"


      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: panel/dist/panel/browser

      - name: Resumen
        run: npm run status

  deploy:
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
